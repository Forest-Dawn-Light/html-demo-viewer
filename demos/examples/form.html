<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f0f4f8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        background: #fff;
        border-radius: 14px;
        padding: 36px 32px;
        width: 100%;
        max-width: 460px;
        box-shadow: 0 8px 32px rgba(0 0 0 / 0.1);
      }

      .card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
      }

      .card-header h2 {
        font-size: 20px;
        color: #1e1e2e;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #666;
        margin-bottom: 6px;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 10px 13px;
        border: 1.5px solid #dde1e7;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        color: #222;
        background: #fafbfc;
        transition: border-color 0.2s, box-shadow 0.2s;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #4f8ef7;
        box-shadow: 0 0 0 3px rgba(79 142 247 / 0.15);
        background: #fff;
      }

      textarea {
        resize: vertical;
        min-height: 90px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .btn {
        width: 100%;
        padding: 12px;
        background: #4f8ef7;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        margin-top: 6px;
        transition: background 0.2s, transform 0.1s;
      }

      .btn:hover  { background: #3b7de8; }
      .btn:active { transform: scale(0.98); }

      .success {
        display: none;
        align-items: center;
        gap: 8px;
        background: #f6ffed;
        border: 1px solid #b7eb8f;
        border-radius: 8px;
        padding: 13px 16px;
        color: #389e0d;
        font-size: 13px;
        font-weight: 500;
        margin-top: 16px;
      }

      .success.visible {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="card-header">
        <span style="font-size:24px">✉️</span>
        <h2>Contact Us</h2>
      </div>

      <form id="form" novalidate>
        <div class="row">
          <div class="field">
            <label for="fname">First Name</label>
            <input id="fname" type="text" placeholder="Jane" required />
          </div>
          <div class="field">
            <label for="lname">Last Name</label>
            <input id="lname" type="text" placeholder="Doe" required />
          </div>
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" type="email" placeholder="jane@example.com" required />
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <select id="subject">
            <option>General Inquiry</option>
            <option>Technical Support</option>
            <option>Billing Question</option>
            <option>Feature Request</option>
            <option>Other</option>
          </select>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" placeholder="Write your message here…" required></textarea>
        </div>

        <button type="submit" class="btn">Send Message →</button>
      </form>

      <div id="success" class="success">
        <span>✅</span> Your message has been sent! We'll get back to you shortly.
      </div>
    </div>

    <script>
      document.getElementById('form').addEventListener('submit', function (e) {
        e.preventDefault();
        this.style.display = 'none';
        document.getElementById('success').classList.add('visible');
      });
    </script>
  </body>
</html>
